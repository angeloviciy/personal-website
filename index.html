<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Yogev Angelovici</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --fg: #111111;
            --fg-2: #555555;
            --fg-3: #999999;
            --bg: #ffffff;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            font-size: 14px;
        }

        #map {
            position: fixed;
            inset: 0;
            display: block;
        }

        .overlay {
            position: fixed;
            z-index: 1;
        }

        .corner-tl {
            top: 1.5rem;
            left: 1.75rem;
        }

        .name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .name a {
            color: var(--fg);
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 1rem;
        }

        .nav a {
            font-size: 13px;
            color: var(--fg-3);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav a:hover {
            color: var(--fg);
        }

        .corner-tr {
            top: 1.5rem;
            right: 1.75rem;
            text-align: right;
        }

        .map-label {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--fg-2);
        }

        .corner-bl {
            bottom: 1.5rem;
            left: 1.75rem;
            max-width: 320px;
        }

        .caption {
            font-size: 12px;
            line-height: 1.6;
            color: var(--fg-2);
        }

        .caption .sub {
            color: var(--fg-3);
        }

        .caption a {
            color: var(--fg-2);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .caption a:hover {
            color: var(--fg);
        }

        @media (max-width: 640px) {
            .corner-bl {
                max-width: 230px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .anim {
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .d2 { animation-delay: 0.2s; }
    </style>
</head>
<body>
    <canvas id="map"></canvas>

    <div class="overlay corner-tl anim">
        <div class="name"><a href="/">Yogev Angelovici</a></div>
        <nav class="nav">
            <a href="pages.html#about">About</a>
            <a href="pages.html#readings">Readings</a>
            <a href="pages.html#writings">Writings</a>
        </nav>
    </div>

    <div class="overlay corner-tr anim">
        <div class="map-label">one day in SF</div>
    </div>

    <div class="overlay corner-bl anim d2">
        <div class="caption">
            San Francisco, drawn in time. Every street sits at its travel
            time from my front door — on foot or by transit, whichever is
            faster. The rings are minutes, not miles.
            <span class="sub">The grid breathes as the timetable wakes and
            sleeps. <a href="pages.html#writings">Why this map</a></span>
        </div>
    </div>

    <script src="assets/map.js"></script>
</body>
</html>
