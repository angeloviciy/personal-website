<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Yogev Angelovici</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --fg: #111111;
            --fg-2: #555555;
            --fg-3: #999999;
            --bg: #ffffff;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            font-size: 14px;
        }

        #map {
            position: fixed;
            inset: 0;
            display: block;
        }

        .overlay {
            position: fixed;
            z-index: 1;
        }

        .corner-tl {
            top: 1.5rem;
            left: 1.75rem;
        }

        .name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .name a {
            color: var(--fg);
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 1rem;
        }

        .nav a {
            font-size: 13px;
            color: var(--fg-3);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav a:hover {
            color: var(--fg);
        }

        .corner-tr {
            top: 1.5rem;
            right: 1.75rem;
            text-align: right;
        }

        .corner-tr a {
            display: block;
            font-size: 13px;
            line-height: 1.9;
            color: var(--fg-3);
            text-decoration: none;
            transition: color 0.2s;
        }

        .corner-tr a:hover {
            color: var(--fg);
        }

        .corner-br {
            bottom: 1.5rem;
            right: 1.75rem;
            max-width: 380px;
            text-align: right;
        }

        .caption {
            font-size: 12px;
            line-height: 1.6;
            color: var(--fg-2);
            text-wrap: balance;
        }

        .caption .sub {
            color: var(--fg-3);
        }

        .caption a {
            color: var(--fg-2);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .caption a:hover {
            color: var(--fg);
        }

        @media (max-width: 640px) {
            .corner-br {
                max-width: 230px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .anim {
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .d2 { animation-delay: 0.2s; }
    </style>
</head>
<body>
    <canvas id="map"></canvas>

    <div class="overlay corner-tl anim">
        <div class="name"><a href="/">Yogev Angelovici</a></div>
        <nav class="nav">
            <a href="pages.html#about">About</a>
            <a href="pages.html#readings">Readings</a>
            <a href="pages.html#writings">Writings</a>
        </nav>
    </div>

    <div class="overlay corner-tr anim">
        <a href="https://github.com/angeloviciy" target="_blank" rel="noopener noreferrer">github</a>
        <a id="email-link" href="#">email</a>
    </div>

    <div class="overlay corner-br anim d2">
        <div class="caption">
            An isochrone map of SF over the course of a day. Time is defined
            by the faster of public transit or simply walking.
            <span class="sub" style="display: block;"><a href="writings/collapsing-the-isochrone.html">Why this map</a></span>
        </div>
    </div>

    <script src="assets/map.js"></script>
    <script>
        // Assemble the address at runtime so it never appears in the
        // page source for harvesters to scrape.
        (function () {
            const u = ['angel', 'oviciy'].join('');
            const d = ['gmail', 'com'].join('.');
            const el = document.getElementById('email-link');
            el.href = 'mai' + 'lto:' + u + '@' + d;
            el.title = u + '@' + d;
        })();
    </script>
</body>
</html>
